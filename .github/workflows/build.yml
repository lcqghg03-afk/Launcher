name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Doi ten APK
        run: cp app/build/outputs/apk/release/app-release.apk TVLauncher.apk
      - name: Phat hanh len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Launcher ban ${{ github.run_number }}
          body: Tai file TVLauncher.apk ben duoi roi cai len TV.
          files: TVLauncher.apk
          make_latest: true
