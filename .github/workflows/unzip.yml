name: Giai nen
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen zip vao kho
        run: |
          if [ ! -f TVLauncher_github.zip ]; then echo "Khong thay file zip"; exit 0; fi
          unzip -q TVLauncher_github.zip -d /tmp/x
          rm -rf /tmp/x/TVLauncher/.github
          cp -r /tmp/x/TVLauncher/. .
          rm TVLauncher_github.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Giai nen ma nguon"
          git push
